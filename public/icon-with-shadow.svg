<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Outer Drop Shadows -->
    <filter id="app-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="20" stdDeviation="28" flood-color="#020617" flood-opacity="0.75" />
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#38bdf8" flood-opacity="0.25" />
    </filter>

    <!-- Neon Glow Filter -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="soft-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="60" y1="40" x2="450" y2="470" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>

    <!-- Squircle Border Metallic Gradient -->
    <linearGradient id="border-grad" x1="40" y1="40" x2="472" y2="472" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#818cf8" stop-opacity="0.5" />
      <stop offset="70%" stop-color="#c084fc" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.4" />
    </linearGradient>

    <!-- Ambient Radials -->
    <radialGradient id="radial-cyan" cx="200" cy="200" r="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="radial-purple" cx="320" cy="310" r="170" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </radialGradient>

    <!-- Request Stream Gradient (Cyan to Sky) -->
    <linearGradient id="req-cyan-grad" x1="140" y1="360" x2="340" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="45%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#22d3ee" />
    </linearGradient>

    <!-- Response / Routing Gradient (Violet to Indigo) -->
    <linearGradient id="res-purple-grad" x1="220" y1="240" x2="370" y2="370" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="55%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Loop Accent Gradient -->
    <linearGradient id="loop-grad" x1="180" y1="140" x2="350" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Node Glow -->
    <radialGradient id="node-cyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="node-violet" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Base Icon Card with Shadow -->
  <g filter="url(#app-shadow)">
    <!-- Squircle Body -->
    <rect x="44" y="44" width="424" height="424" rx="100" fill="url(#bg-grad)" stroke="url(#border-grad)" stroke-width="3.5" />
    
    <!-- Inner Ambient Lighting -->
    <rect x="44" y="44" width="424" height="424" rx="100" fill="url(#radial-cyan)" />
    <rect x="44" y="44" width="424" height="424" rx="100" fill="url(#radial-purple)" />
  </g>

  <!-- Cybernetic Grid / Circuit Orbits -->
  <g opacity="0.45">
    <!-- Outer dashed orbit -->
    <circle cx="256" cy="256" r="165" fill="none" stroke="#38bdf8" stroke-width="1.8" stroke-dasharray="6 10" />
    <!-- Inner subtle orbit -->
    <circle cx="256" cy="256" r="128" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="4 8" opacity="0.6" />
    <!-- Horizontal guide track -->
    <line x1="90" y1="256" x2="135" y2="256" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.5" />
    <line x1="377" y1="256" x2="422" y2="256" stroke="#c084fc" stroke-width="2" stroke-linecap="round" opacity="0.5" />
    <!-- Vertical guide track -->
    <line x1="256" y1="90" x2="256" y2="135" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.5" />
    <line x1="256" y1="377" x2="256" y2="422" stroke="#818cf8" stroke-width="2" stroke-linecap="round" opacity="0.5" />
  </g>

  <!-- Glow Layers for Main Emblem -->
  <g filter="url(#soft-glow)" opacity="0.6">
    <!-- Glowing R Loop Path -->
    <path d="M 168 358 L 168 180 C 168 145 200 135 242 135 C 298 135 342 160 342 208 C 342 250 302 272 250 272 L 168 272" 
          fill="none" stroke="url(#loop-grad)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Glowing Diagonal Leg -->
    <path d="M 245 272 L 338 358" 
          fill="none" stroke="url(#res-purple-grad)" stroke-width="28" stroke-linecap="round" />
  </g>

  <!-- Core Sharp Emblem Shape (ReqCraft "R" made of Network Request & Response Flow) -->
  <g>
    <!-- Left Vertical Data Bus / Stem -->
    <path d="M 168 358 L 168 180 C 168 148 196 138 238 138 C 292 138 338 162 338 208 C 338 248 300 270 252 270 L 168 270" 
          fill="none" stroke="url(#loop-grad)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Top Loop Inner Contrast Rail -->
    <path d="M 168 220 L 168 180 C 168 160 188 152 225 152 C 270 152 318 172 318 208 C 318 236 288 254 248 254" 
          fill="none" stroke="#f8fafc" stroke-width="4" stroke-linecap="round" opacity="0.4" />

    <!-- Forward Dynamic Request Arrow (Top Right of Loop) -->
    <path d="M 315 178 L 342 208 L 312 238" 
          fill="none" stroke="#22d3ee" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" filter="url(#neon-glow)" />

    <!-- Mock Response & Route Leg (Diagonal Thrust) -->
    <path d="M 246 270 L 338 358" 
          fill="none" stroke="url(#res-purple-grad)" stroke-width="22" stroke-linecap="round" />

    <!-- Diagonal Leg Inner Light Rail -->
    <path d="M 256 274 L 328 342" 
          fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.5" />

    <!-- Dynamic Return / Routing Arrow Head (Bottom Right Leg) -->
    <path d="M 318 358 L 346 366 L 338 336" 
          fill="none" stroke="#c084fc" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" filter="url(#neon-glow)" />

    <!-- Upward Request Stream Accent (Parallel to Stem) -->
    <path d="M 136 330 L 136 210" 
          fill="none" stroke="url(#req-cyan-grad)" stroke-width="5" stroke-linecap="round" stroke-dasharray="10 8" opacity="0.8" />
    <polygon points="136,196 142,208 130,208" fill="#38bdf8" />

    <!-- Bidirectional HTTP Exchange Curved Accents -->
    <!-- Curved Forward Arrow (Top) -->
    <path d="M 220 184 C 240 180 270 186 284 200" 
          fill="none" stroke="#38bdf8" stroke-width="4.5" stroke-linecap="round" />
    <!-- Curved Return Arrow (Bottom) -->
    <path d="M 280 226 C 265 238 235 238 215 232" 
          fill="none" stroke="#c084fc" stroke-width="4.5" stroke-linecap="round" />
    <polyline points="222,228 215,232 222,238" fill="none" stroke="#c084fc" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Network Terminal Pulsing Nodes -->
  <g filter="url(#neon-glow)">
    <!-- Stem Base Node -->
    <circle cx="168" cy="358" r="8" fill="#38bdf8" />
    <circle cx="168" cy="358" r="4" fill="#ffffff" />

    <!-- Stem Mid Node -->
    <circle cx="168" cy="270" r="7" fill="#818cf8" />
    <circle cx="168" cy="270" r="3" fill="#ffffff" />

    <!-- Crest Node -->
    <circle cx="238" cy="138" r="8" fill="#38bdf8" />
    <circle cx="238" cy="138" r="4" fill="#ffffff" />

    <!-- Center Intersection Node -->
    <circle cx="248" cy="270" r="9" fill="#c084fc" />
    <circle cx="248" cy="270" r="4.5" fill="#ffffff" />

    <!-- Diagonal Endpoint Node -->
    <circle cx="340" cy="360" r="8" fill="#a855f7" />
    <circle cx="340" cy="360" r="4" fill="#ffffff" />

    <!-- Auxiliary Data Packets -->
    <circle cx="256" cy="90" r="4" fill="#38bdf8" opacity="0.9" />
    <circle cx="422" cy="256" r="4" fill="#c084fc" opacity="0.9" />
    <circle cx="90" cy="256" r="4" fill="#38bdf8" opacity="0.9" />
  </g>
</svg>
